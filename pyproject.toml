[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QHOT"
version = "2.1.1"
description = "Holographic optical trapping instrument control"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "David G. Grier", email = "david.grier@nyu.edu" },
]
keywords = ["holographic optical trapping", "SLM", "CGH", "optics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyqtgraph>=0.13",
    "tomlkit>=0.11",
    "qtpy>=2.0",
    "QVideo[dvr]>=4.11.0",
]

[project.urls]
Homepage = "https://github.com/davidgrier/QHOT"
Repository = "https://github.com/davidgrier/QHOT"
Issues = "https://github.com/davidgrier/QHOT/issues"

[project.optional-dependencies]
pyqt5 = ["PyQt5>=5.15"]
pyqt6 = ["PyQt6"]
pyside6 = ["PySide6>=6.7"]
dev = ["pytest", "pytest-cov"]
docs = [
    "pydata-sphinx-theme",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-bibtex",
]
torch = ["torch>=2.0"]
numba = ["numba>=0.60"]

[project.scripts]
qhot = "QHOT.qhot:main"

[tool.setuptools]
package-dir = {"QHOT" = "."}
# Every directory that has an __init__.py is a package, and must be listed:
# a package that is not listed is missing from the wheel.
# tests/test_packaging.py checks the list.
packages = [
    "QHOT",
    "QHOT.lib",
    "QHOT.lib.holograms",
    "QHOT.lib.holograms.backends",
    "QHOT.lib.tasks",
    "QHOT.lib.traps",
    "QHOT.tasks",
    "QHOT.traps",
]

[tool.setuptools.package-data]
"QHOT" = ["*.ui", "help/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["QHOT"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/old/*",
    "*/.ipynb_checkpoints/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 79
extend-exclude = ["devel", "old"]

[tool.ruff.lint]
# F pyflakes, B bugbear, E501 line length, Q quotes, RUF012 mutable class
# attributes, RUF100 stale noqa, UP037 quoted annotations.
select = ["F", "B", "E501", "Q", "RUF012", "RUF100", "UP037"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# Package files re-export names; tests build stubs and mocks.
"__init__.py" = ["F401"]
"tests/*" = ["E501", "F401", "F811", "F841", "B018", "B905", "RUF012"]
