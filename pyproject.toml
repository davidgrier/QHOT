[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QHOT"
version = "2.4.0"
description = "Holographic optical trapping instrument control"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "David G. Grier", email = "david.grier@nyu.edu" },
]
keywords = ["holographic optical trapping", "SLM", "CGH", "optics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyqtgraph>=0.13",
    "tomlkit>=0.11",
    "qtpy>=2.0",
    "QVideo[dvr]>=4.28.0",
]

[project.urls]
Homepage = "https://github.com/davidgrier/QHOT"
Repository = "https://github.com/davidgrier/QHOT"
Issues = "https://github.com/davidgrier/QHOT/issues"

[project.optional-dependencies]
pyqt5 = ["PyQt5>=5.15"]
pyqt6 = ["PyQt6"]
dev = ["pytest", "pytest-cov"]
docs = [
    "pydata-sphinx-theme",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-bibtex",
]
torch = ["torch>=2.0"]
numba = ["numba>=0.60"]

[project.scripts]
qhot = "QHOT.qhot:main"

[tool.setuptools]
package-dir = {"QHOT" = "."}
# Every directory that has an __init__.py is a package, and must be listed:
# a package that is not listed is missing from the wheel.
# tests/test_packaging.py checks the list.
packages = [
    "QHOT",
    "QHOT.lib",
    "QHOT.lib.holograms",
    "QHOT.lib.holograms.backends",
    "QHOT.lib.tasks",
    "QHOT.lib.traps",
    "QHOT.tasks",
    "QHOT.traps",
]

[tool.setuptools.package-data]
"QHOT" = ["*.ui", "help/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["QHOT"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.ipynb_checkpoints/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# What the legs of the CI reach without torch and numba, less a point.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# F pyflakes, B bugbear, E501 line length, Q quotes, SIM simplifications
# (except SIM905), PERF performance, PIE misc, RUF012 mutable class
# attributes, RUF100 stale noqa, UP037 quoted annotations; E402 imports at
# the top, E731 lambda assigned, E741 ambiguous name, RUF015 first element,
# RUF059 unused unpacked variable, PLW0108 needless lambda, PLW1510
# subprocess without check, TID252 a relative import of a parent (a sibling
# is imported as `.name`), A001 and A002 a name that hides a builtin, C400
# and C401 a generator that is a comprehension, PLW2901 a loop variable that
# is overwritten.
select = ["F", "B", "E402", "E501", "E731", "E741", "Q", "SIM", "PERF",
          "PIE", "PLW0108", "PLW1510", "PLW2901", "RUF012", "RUF015",
          "RUF059", "RUF100", "TID252", "UP037", "A001", "A002", "C400",
          "C401"]
ignore = ["SIM905"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# Package files re-export names; tests build stubs and mocks.
"__init__.py" = ["F401"]
# Sphinx reads the name `copyright`.
"docs/conf.py" = ["A001", "E402"]
# Tests import after patching, unpack to name what they do not use, keep a
# temporary file open across a test, and are not held to the style rules
# that simplify code (a lambda in a test is often late binding on purpose,
# and a test runs a child process without a check).
"tests/*" = ["E402", "E501", "F401", "F811", "F841", "B018", "B905",
             "RUF012", "RUF059", "SIM", "PERF", "PIE", "PLW2901",
             "UP037", "PLW0108", "PLW1510", "E731", "RUF015", "A002"]

[tool.pyright]
# Type checking of the program (lib/, traps/, tasks/ and qhot.py, not the
# tests), as in QVideo.  Run it in an environment with PyQt6
# and no other Qt binding.  qtpy does not declare Slot and Signal as exports
# of its modules (reportPrivateImportUsage), and the Qt stubs type the
# arguments of event handlers as Optional (reportIncompatibleMethodOverride):
# neither says anything about our code.
include = ["lib", "traps", "tasks", "qhot.py"]
pythonVersion = "3.11"
extraPaths = [".."]
reportPrivateImportUsage = "none"
reportIncompatibleMethodOverride = "none"
# pyright cannot read ``__all__ = 'a b'.split()``, which is the style.
reportUnsupportedDunderAll = "none"
