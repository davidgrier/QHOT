name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      - run: ruff check .

  types:
    name: Types (pyright)
    runs-on: ubuntu-latest
    # The report is empty, so a type error fails the workflow.  Pyright is
    # pinned, as in QVideo: a newer version finds new things, for us to fix
    # when we choose to move (change the pin and the report together).
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # PyQt6 6.12.1 types every QtCore.Signal(...) as missing an argument
      # (and super().__init__(parent) as a wrong type): 40 reports that are
      # not ours.  Stay on 6.12.0 until a release has the stubs right.
      - run: pip install -e ".[dev,pyqt6]" pyright==1.1.414 PyQt6==6.12.0 PyQt6-Qt6==6.12.0
      - run: pyright

  package:
    name: Wheel
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libegl1 libglib2.0-0 libxkbcommon0
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Install the wheel, not the checkout
        run: pip install "$(ls dist/*.whl)[pyqt6]"
      - name: Import the program and read its files, from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'EOF'
          import QHOT
          assert 'site-packages' in QHOT.__file__, QHOT.__file__
          from QHOT.lib.holograms import CGH, QCGHTree
          from QHOT.lib.traps import QTrapOverlay
          from QHOT.lib import tasks as lib_tasks
          import QHOT.tasks, QHOT.traps
          from QHOT.lib.holograms import Optics
          from QHOT.lib.holograms.backends import Backend, NumpyBackend
          from QHOT.traps import QTweezer
          hologram = NumpyBackend().hologram(
              (QTweezer(r=(8, 8, 0), phase=0.).spec(),),
              Optics(shape=(16, 16)),
          )
          assert hologram.shape == (16, 16), hologram.shape
          from QHOT.lib import choose_backend
          assert isinstance(choose_backend(), Backend)
          from QHOT.qhot import QHOT as Window
          assert Window.UIFILE.is_file(), Window.UIFILE
          assert (Window.HELPDIR / 'index.html').is_file(), Window.HELPDIR
          from pyqtgraph.Qt import QtWidgets
          app = QtWidgets.QApplication([])
          QCGHTree(cgh=CGH())
          print('the installed package works:', QHOT.__file__)
          EOF

  test:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} (${{ matrix.binding }}${{ matrix.extras }})
    runs-on: ${{ matrix.os }}
    # A leg that is marked experimental reports and does not fail the
    # workflow, until it has been green for a while and is made to count.
    continue-on-error: ${{ matrix.experimental }}
    env:
      QT_QPA_PLATFORM: offscreen

    strategy:
      fail-fast: false
      # Every leg is written out: a leg that the matrix has no other
      # combination for would lack the keys that it does not name.
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11", binding: pyqt6,
             extras: "", experimental: false}
          - {os: ubuntu-latest, python-version: "3.12", binding: pyqt6,
             extras: "", experimental: false}
          - {os: ubuntu-latest, python-version: "3.12", binding: pyqt5,
             extras: "", experimental: false}
          # one leg also tests the optional numba backend
          - {os: ubuntu-latest, python-version: "3.12", binding: pyqt6,
             extras: ",numba", experimental: false}
          # newer Pythons
          - {os: ubuntu-latest, python-version: "3.13", binding: pyqt6,
             extras: "", experimental: false}
          - {os: ubuntu-latest, python-version: "3.14", binding: pyqt6,
             extras: "", experimental: false}
          # the platform that QHOT runs on
          - {os: macos-latest, python-version: "3.12", binding: pyqt6,
             extras: "", experimental: false}
          # declared, and not yet shown to work
          - {os: ubuntu-latest, python-version: "3.12", binding: pyside6,
             extras: "", experimental: true}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon0

      - name: Install package and test dependencies
        run: pip install -e ".[dev,${{ matrix.binding }}${{ matrix.extras }}]"

      - name: Run tests
        run: python -m pytest --tb=short -q --cov=QHOT --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          name: ${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.binding }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
