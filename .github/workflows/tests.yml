name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  package:
    name: Wheel
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libegl1 libglib2.0-0 libxkbcommon0
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Install the wheel, not the checkout
        run: pip install "$(ls dist/*.whl)[pyqt6]"
      - name: Import the program and read its files, from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'EOF'
          import QHOT
          assert 'site-packages' in QHOT.__file__, QHOT.__file__
          from QHOT.lib.holograms import CGH, QCGHTree
          from QHOT.lib.traps import QTrapOverlay
          from QHOT.lib import tasks as lib_tasks
          import QHOT.tasks, QHOT.traps
          from QHOT.lib.holograms import Optics
          from QHOT.lib.holograms.backends import Backend, NumpyBackend
          from QHOT.traps import QTweezer
          hologram = NumpyBackend().hologram(
              (QTweezer(r=(8, 8, 0), phase=0.).spec(),),
              Optics(shape=(16, 16)),
          )
          assert hologram.shape == (16, 16), hologram.shape
          from QHOT.lib import choose_backend
          assert isinstance(choose_backend(), Backend)
          from QHOT.qhot import QHOT as Window
          assert Window.UIFILE.is_file(), Window.UIFILE
          assert (Window.HELPDIR / 'index.html').is_file(), Window.HELPDIR
          from pyqtgraph.Qt import QtWidgets
          app = QtWidgets.QApplication([])
          QCGHTree(cgh=CGH())
          print('the installed package works:', QHOT.__file__)
          EOF

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.binding }}${{ matrix.extras }})
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      QT_QPA_PLATFORM: offscreen

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        binding: ["pyqt6"]
        extras: [""]
        include:
          - python-version: "3.12"
            binding: "pyqt5"
          # one leg also tests the optional numba backend
          - python-version: "3.12"
            binding: "pyqt6"
            extras: ",numba"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon0

      - name: Install package and test dependencies
        run: pip install -e ".[dev,${{ matrix.binding }}${{ matrix.extras }}]"

      - name: Run tests
        run: python -m pytest --tb=short -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
